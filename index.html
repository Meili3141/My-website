<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>周宏麗｜我的多語數位名片</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#fdf6ee; --card:#ffffff; --ink:#2b2118; --muted:#6f5f52;
  --accent:#e8873a; --accent-ink:#ffffff; --soft:#fbe4cf; --line:#f0d9c3;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1612; --card:#2a211b; --ink:#f6ece2; --muted:#c3b2a2;
    --accent:#f0954a; --accent-ink:#1d1612; --soft:#3a2b20; --line:#4a382b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1612; --card:#2a211b; --ink:#f6ece2; --muted:#c3b2a2;
  --accent:#f0954a; --accent-ink:#1d1612; --soft:#3a2b20; --line:#4a382b;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","Noto Sans Thai",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  line-height:1.75;font-size:17px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
  padding:10px 18px;gap:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.brand{font-weight:700;color:var(--accent)}
.lang{display:flex;gap:6px}
.lang button{border:1px solid var(--accent);background:transparent;color:var(--accent);
  padding:5px 12px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
main{max-width:860px;margin:0 auto;padding:0 18px 40px}
.hero{margin:26px 0 10px;padding:34px 26px;border-radius:24px;
  background:linear-gradient(135deg,var(--soft),var(--card));border:1px solid var(--line)}
.hero small{color:var(--accent);font-weight:700;letter-spacing:.08em}
.hero h1{margin:6px 0 4px;font-size:clamp(34px,8vw,54px);line-height:1.15}
.hero p{margin:4px 0;color:var(--muted)}
h2{margin:34px 0 12px;font-size:24px;border-left:6px solid var(--accent);padding-left:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--soft);border-radius:999px;padding:6px 16px;font-weight:500}
.chip.fav{background:var(--accent);color:var(--accent-ink)}
.card h3{margin:0 0 6px;font-size:19px;color:var(--accent)}
.card p{margin:0;color:var(--muted);font-size:15.5px}
ol.intro{margin:0;padding:0;list-style:none;counter-reset:n}
ol.intro li{counter-increment:n;padding:10px 0 10px 44px;position:relative;border-bottom:1px dashed var(--line)}
ol.intro li:last-child{border-bottom:0}
ol.intro li::before{content:counter(n);position:absolute;left:0;top:12px;width:30px;height:30px;
  border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;
  display:flex;align-items:center;justify-content:center;font-size:14px}
.zh{font-size:18px;font-weight:500}
.tr{display:block;color:var(--muted);font-size:14.5px;margin-top:2px}
.hl{background:var(--soft);border-radius:6px;padding:0 4px;font-weight:700}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:16px}
.shot{position:relative;margin:0;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--card);aspect-ratio:4/5}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot figcaption{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 10px;color:#fff;font-weight:700;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.pic{margin:-18px -20px 12px;height:190px;overflow:hidden;border-radius:18px 18px 0 0;background:var(--soft)}.pic svg,.pic img{width:100%;height:100%;display:block;object-fit:cover}
.credit{font-size:12.5px;margin-top:6px;opacity:.85}
footer{text-align:center;color:var(--muted);font-size:14px;padding:24px 18px 36px}
</style>
</head>
<body>
<header>
  <span class="brand">周宏麗 ✦ Zhou Hongli</span>
  <div class="lang" role="group" aria-label="Language">
    <button data-l="zh" aria-pressed="true">中文</button>
    <button data-l="en" aria-pressed="false">English</button>
    <button data-l="th" aria-pressed="false">ไทย</button>
  </div>
</header>
<main>
  <section class="hero">
    <small data-i="tag"></small>
    <h1 data-i="name"></h1>
    <p data-i="school"></p>
    <p data-i="native"></p>
  </section>

  <h2 data-i="h_about"></h2>
  <div class="grid">
    <div class="card"><h3 data-i="c1t"></h3><p data-i="c1p"></p></div>
    <div class="card"><h3 data-i="c2t"></h3><p data-i="c2p"></p></div>
    <div class="card"><h3 data-i="c3t"></h3><p data-i="c3p"></p></div>
  </div>

  <h2 data-i="h_hobby"></h2>
  <div class="chips" id="chips"></div>
  <div class="gallery" id="gallery"></div>

  <h2 data-i="h_home"></h2>
  <div class="grid" id="home"></div>

  <h2 data-i="h_intro"></h2>
  <div class="card"><ol class="intro" id="intro"></ol></div>
</main>
<footer><div data-i="foot"></div><div class="credit" data-i="credit"></div></footer>

function setLang(l){
  var d=L[l];

document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(){setLang(b.dataset.l)})});
